<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4338ca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- iOS App Icon Solid Rounded Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Glassmorphism Card Element inside Icon -->
  <rect x="80" y="120" width="352" height="272" rx="36" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" filter="url(#shadow)" />

  <!-- Card Top Stripe / Magnetic Band -->
  <path d="M 80 180 L 432 180" stroke="#ffffff" stroke-width="3" stroke-opacity="0.2" />

  <!-- Central Pulse Circle -->
  <circle cx="256" cy="285" r="70" fill="url(#accentGrad)" filter="url(#shadow)" />

  <!-- Trending Growth Arrow -->
  <path d="M 220 295 L 246 270 L 268 288 L 295 252" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="280,252 295,252 295,267" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Floating Sparkles / Coins -->
  <circle cx="360" cy="220" r="14" fill="#fbbf24" />
  <circle cx="150" cy="330" r="10" fill="#a5b4fc" fill-opacity="0.8" />
</svg>
