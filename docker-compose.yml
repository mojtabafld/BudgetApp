version: '3.8'

services:
  # Budget Master PWA Frontend Container
  budgetmaster-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budgetmaster_app
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - budgetmaster-db
    networks:
      - budgetmaster-network

  # PostgreSQL Database Container for DigitalOcean
  budgetmaster-db:
    image: postgres:16-alpine
    container_name: budgetmaster_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-budgetmaster_db}
      POSTGRES_USER: ${POSTGRES_USER:-budgetmaster_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budget_master_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - budgetmaster-network

  # Database Admin UI (Adminer - for easy database management on DigitalOcean)
  budgetmaster-db-admin:
    image: adminer:latest
    container_name: budgetmaster_db_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: budgetmaster-db
    depends_on:
      - budgetmaster-db
    networks:
      - budgetmaster-network

networks:
  budgetmaster-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
