name: budgetmaster-app
region: ams # Amsterdam (Europe) - can be changed to fra, nyc, etc.

services:
- name: web
  dockerfilePath: Dockerfile
  source_dir: /
  github:
    branch: main
    repo: mojtabafld/BudgetApp
    deploy_on_push: true
  http_port: 80
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  routes:
  - path: /
  envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${budgetmaster-db.DATABASE_URL}
  - key: NODE_ENV
    scope: RUN_TIME
    value: production
  - key: DEFAULT_CURRENCY
    scope: RUN_TIME
    value: DKK

# Automatically Provisioned Managed PostgreSQL Database on DigitalOcean
databases:
- engine: PG
  name: budgetmaster-db
  num_nodes: 1
  size: db-s-dev-database # Development database tier on DigitalOcean
  version: "16"
